<g><path d="M 1220 330 L 1624 330 L 1640 346 L 1640 416 L 1220 416 Z" fill="#FFF9E6" stroke="#BF9000" stroke-width="1.3"/><path d="M 1624 330 L 1624 346 L 1640 346" fill="none" stroke="#BF9000" stroke-width="1.3"/><text x="1232.0" y="354.0" font-family="DejaVu Sans" font-size="13" fill="#5C4A00" text-anchor="start">Las cinco agrupaciones cubren las 21 entidades del</text><text x="1232.0" y="374.0" font-family="DejaVu Sans" font-size="13" fill="#5C4A00" text-anchor="start">modelo. El detalle de atributos y multiplicidades</text><text x="1232.0" y="394.0" font-family="DejaVu Sans" font-size="13" fill="#5C4A00" text-anchor="start">está en los diagramas uml-01 a uml-05.</text></g>
<g><path d="M 1220 520 L 1624 520 L 1640 536 L 1640 606 L 1220 606 Z" fill="#FFF9E6" stroke="#BF9000" stroke-width="1.3"/><path d="M 1624 520 L 1624 536 L 1640 536" fill="none" stroke="#BF9000" stroke-width="1.3"/><text x="1232.0" y="544.0" font-family="DejaVu Sans" font-size="13" fill="#5C4A00" text-anchor="start">Cada caja es una entidad. El rombo relleno indica</text><text x="1232.0" y="564.0" font-family="DejaVu Sans" font-size="13" fill="#5C4A00" text-anchor="start">composición y la flecha discontinua, dependencia.</text><text x="1232.0" y="584.0" font-family="DejaVu Sans" font-size="13" fill="#5C4A00" text-anchor="start">«nueva» marca una entidad que no figura en 7.1.5.</text></g>
